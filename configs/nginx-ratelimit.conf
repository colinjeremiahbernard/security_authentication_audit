# ====================================================================
# Configuração Nginx: Rate Limiting para Endpoints de Autenticação Web
# Destino comum: /etc/nginx/conf.d/ratelimit.conf ou embutido no nginx.conf
# ====================================================================

# 1. Definição da zona de memória compartilhada para rastreamento de requisições por IP
# - $binary_remote_addr: chave eficiente (4 bytes para IPv4)
# - zone=auth_limit:10m: aloca 10 Megabytes na memória (~160.000 IPs únicos rastreados)
# - rate=5r/m: permite uma taxa média máxima de 5 requisições por minuto
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# 2. Definição do código de status retornado ao ultrapassar o limite (429 Too Many Requests)
limit_req_status 429;

server {
    listen 80;
    server_name dvwa.local;

    # Proteção focada no endpoint de autenticação
    location /login.php {
        # Aplica a limitação com burst de 2 requisições e processamento imediato sem atraso
        limit_req zone=auth_limit burst=2 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Demais rotas da aplicação (fluxo normal)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
