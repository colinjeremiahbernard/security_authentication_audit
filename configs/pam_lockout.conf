# ====================================================================
# Configuração de Bloqueio de Contas no Linux via Módulo PAM (pam_faillock)
# Comumente inserido em /etc/pam.d/common-auth ou /etc/pam.d/system-auth
# ====================================================================

# 1. No topo da pilha de autenticação (auth):
# Registra as tentativas antes da validação da senha
auth    required    pam_faillock.so preauth silent deny=5 unlock_time=900 fail_interval=900

# 2. Mecanismo padrão de autenticação do sistema (exemplo Unix)
auth    [success=1 default=bad] pam_unix.so nullok

# 3. Caso a validação de senha falhe:
# Registra o erro no contador da conta
auth    [default=die] pam_faillock.so authfail

# 4. Na seção de sucesso de conta (account):
# Garante que a conta não esteja bloqueada antes de conceder acesso
account required    pam_faillock.so

# --------------------------------------------------------------------
# Parâmetros explicados:
# - deny=5: Bloqueia a conta após 5 falhas consecutivas.
# - unlock_time=900: Tempo de bloqueio de 900 segundos (15 minutos).
# - fail_interval=900: Janela de tempo para somar as falhas consecutivas.
# --------------------------------------------------------------------
